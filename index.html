<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los 5 añitos de Ailín</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --rosa: #ff66a3;
            --lila: #9b5de5;
            --turquesa: #5ed6c7;
            --dorado: #f2c94c;
            --texto: #4a4a4a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffe3f1 0%, #e9ddff 50%, #d9f7f2 100%);
            background-size: 300% 300%;
            animation: fondo 14s ease infinite;
            color: var(--texto);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 20px;
            overflow-x: hidden;
        }
        @keyframes fondo {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Capa de elementos mágicos que flotan */
        #magia { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
        .flota {
            position: absolute;
            bottom: -50px;
            opacity: 0;
            animation: subir linear forwards;
        }
        @keyframes subir {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-110vh) translateX(var(--desvio)) rotate(360deg); opacity: 0; }
        }

        /* Tarjeta con borde arcoíris animado */
        .tarjeta {
            position: relative;
            z-index: 2;
            max-width: 420px;
            width: 100%;
            border-radius: 32px;
            padding: 28px 24px 34px;
            text-align: center;
            border: 6px solid transparent;
            background:
                linear-gradient(#ffffff, #ffffff) padding-box,
                linear-gradient(120deg, #ff66a3, #fee440, #5ed6c7, #9b5de5, #ff66a3) border-box;
            background-size: 100% 100%, 300% 300%;
            animation: aparecer 1s ease-out, fondo 6s linear infinite;
            box-shadow: 0 15px 35px rgba(155, 93, 229, 0.25);
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .subtitulo {
            font-size: 1.05rem;
            color: var(--lila);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Imagen del unicornio (la de la torta) */
        .logo {
            width: 250px;
            max-width: 80%;
            margin: 6px auto 0;
            display: block;
            animation: flotar 3.5s ease-in-out infinite;
            border-radius: 50%;
            box-shadow: 0 8px 18px rgba(155, 93, 229, 0.3);
            cursor: pointer;
        }
        .titulo-respaldo {
            display: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 2.6rem;
            color: var(--rosa);
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        /* Carrusel de fotos */
        .foto-contenedor {
            width: 230px;
            height: 230px;
            margin: 20px auto 8px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, var(--rosa), var(--lila), var(--turquesa), var(--dorado));
            background-size: 300% 300%;
            animation: fondo 5s linear infinite, flotar 4s ease-in-out infinite;
            box-shadow: 0 8px 20px rgba(155, 93, 229, 0.25);
            position: relative;
        }
        .marco {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid white;
            background: #f3e8ff;
            position: relative;
            cursor: pointer;
        }
        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }
        .slide.activa { opacity: 1; }
        .foto-contenedor::after {
            content: "🦄";
            position: absolute;
            right: -10px;
            bottom: -4px;
            font-size: 2.2rem;
            animation: latido 2s infinite;
        }
        @keyframes latido {
            0%, 100% { transform: scale(1) rotate(-6deg); }
            50% { transform: scale(1.18) rotate(6deg); }
        }
        .puntos { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; }
        .punto {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #e4d3fa;
            transition: all 0.3s;
        }
        .punto.activo { background: var(--rosa); transform: scale(1.3); }

        .mensaje { font-size: 1.05rem; margin: 14px 0; line-height: 1.5; }

        .info-evento {
            background: #fdf6fa;
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            border: 2px dashed #d9b8ff;
        }
        .info-evento p { margin: 6px 0; font-weight: 700; font-size: 1rem; }

        .cuenta-regresiva { display: flex; justify-content: space-around; margin: 20px 0; gap: 8px; }
        .tiempo-caja {
            background: linear-gradient(160deg, var(--lila), var(--rosa));
            color: white;
            border-radius: 15px;
            padding: 10px 5px;
            flex: 1;
            box-shadow: 0 4px 10px rgba(155, 93, 229, 0.3);
        }
        .tiempo-caja span { display: block; font-family: 'Fredoka', sans-serif; font-size: 1.5rem; }
        .tiempo-caja small { font-size: 0.75rem; text-transform: uppercase; }
        .hoy { font-family: 'Fredoka', sans-serif; color: var(--rosa); width: 100%; }

        .botones { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn {
            display: block;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s;
            color: white;
        }
        .btn:active { transform: scale(0.96); }
        .btn-wsp { background: #25D366; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.35); }
        .btn-maps { background: var(--rosa); box-shadow: 0 5px 15px rgba(255, 102, 163, 0.35); }
        .btn-cal { background: var(--lila); box-shadow: 0 5px 15px rgba(155, 93, 229, 0.35); }

        .btn-musica {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: white;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(155, 93, 229, 0.4);
            z-index: 10;
        }
        .btn-musica.sonando { animation: latido 1.5s infinite; }
        .btn-musica.llamar { animation: latido 1s infinite; box-shadow: 0 0 0 6px rgba(255, 102, 163, 0.35); }
    </style>
</head>
<body>

    <div id="magia"></div>

    <!-- Música: musica.mp3 (misma carpeta). Si faltara el archivo, suena una melodía de caja de música integrada -->
    <audio id="musica" src="musica.mp3" loop preload="auto"></audio>
    <button id="btnMusica" class="btn-musica llamar" aria-label="Activar música">🎵</button>

    <div class="tarjeta">
        <p class="subtitulo">¡Te invito a festejar!</p>

        <!-- Imagen de la torta (unicornio.jpg) -->
        <img class="logo" id="logo" src="unicornio.jpg" alt="Ailín 5 años"
             onerror="this.style.display='none'; document.getElementById('respaldo').style.display='block';">
        <h1 class="titulo-respaldo" id="respaldo">Ailín · 5 años</h1>

        <!-- Fotos de Ailín (foto1.jpg, foto2.jpg, foto3.jpg). Tocá la foto para pasar a la siguiente -->
        <div class="foto-contenedor">
            <div class="marco" id="marco">
                <img class="slide activa" src="foto1.jpg" alt="Ailín soplando un diente de león" style="object-position: 50% 22%;">
                <img class="slide" src="foto2.jpg" alt="Ailín sonriendo con su vestido blanco" style="object-position: 52% 30%;">
                <img class="slide" src="foto3.jpg" alt="Ailín mirando a cámara" style="object-position: 50% 30%;">
            </div>
        </div>
        <div class="puntos" id="puntos"></div>

        <p class="mensaje">¡Vení a jugar, reír y compartir una tarde mágica llena de unicornios por sus 5 añitos! 🌈✨</p>

        <div class="info-evento">
            <p id="txtFecha">📅</p>
            <p id="txtHora">⏰</p>
            <p id="txtLugar">📍</p>
        </div>

        <div class="cuenta-regresiva" id="cuenta">
            <div class="tiempo-caja"><span id="dias">00</span><small>Días</small></div>
            <div class="tiempo-caja"><span id="horas">00</span><small>Hs</small></div>
            <div class="tiempo-caja"><span id="minutos">00</span><small>Min</small></div>
            <div class="tiempo-caja"><span id="segundos">00</span><small>Seg</small></div>
        </div>

        <div class="botones">
            <a id="linkWsp" target="_blank" rel="noopener" class="btn btn-wsp">✅ Confirmar por WhatsApp</a>
            <a id="linkMaps" target="_blank" rel="noopener" class="btn btn-maps">📍 Cómo llegar (Google Maps)</a>
            <a id="linkCal" target="_blank" rel="noopener" class="btn btn-cal">🗓️ Agendar en mi Calendario</a>
        </div>
    </div>

    <script>
        // ============ EDITAR SOLO ESTA SECCIÓN ============
        const CONFIG = {
            fecha: "2026-12-05",          // AAAA-MM-DD
            hora: "14:00",                // HH:MM (24 hs)
            lugar: "Guatemala 1751, Villa Luzuriaga",
            lugarMaps: "Guatemala 1751, Villa Luzuriaga, La Matanza, Buenos Aires, Argentina",
            coordenadas: "-34.67990125395352,-58.58934973270906",   // para el botón "Cómo llegar"
            whatsapp: "5491132471824",    // 54 9 + código de área + número, sin + ni espacios
        };
        // ==================================================

        const [anio, mes, dia] = CONFIG.fecha.split("-").map(Number);
        const inicio = new Date(anio, mes - 1, dia, ...CONFIG.hora.split(":").map(Number));
        // El calendario necesita una hora de fin: se usa 3 horas después (no se muestra en la tarjeta)
        const finCalendario = new Date(inicio.getTime() + 3 * 3600 * 1000);

        const fechaTxt = inicio.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
        document.getElementById("txtFecha").textContent = "📅 " + fechaTxt.charAt(0).toUpperCase() + fechaTxt.slice(1);
        document.getElementById("txtHora").textContent = `⏰ ${CONFIG.hora} hs`;
        document.getElementById("txtLugar").textContent = "📍 " + CONFIG.lugar;

        const msg = "¡Hola! Confirmo asistencia al cumple de 5 años de Ailín. Nombre y cantidad de personas: ";
        document.getElementById("linkWsp").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
        document.getElementById("linkMaps").href = "https://www.google.com/maps/dir/?api=1&destination=" + CONFIG.coordenadas + "&travelmode=driving";

        const f = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0")
            + "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00";
        document.getElementById("linkCal").href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
            + "&text=" + encodeURIComponent("Cumple de 5 de Ailín")
            + "&dates=" + f(inicio) + "/" + f(finCalendario)
            + "&ctz=America/Argentina/Buenos_Aires"
            + "&details=" + encodeURIComponent("¡Te esperamos para festejar sus 5 años!")
            + "&location=" + encodeURIComponent(CONFIG.lugarMaps);

        // ---------- CARRUSEL DE FOTOS ----------
        const slides = document.querySelectorAll(".slide");
        const contPuntos = document.getElementById("puntos");
        let actual = 0, timerFotos = null;
        slides.forEach(() => { const p = document.createElement("span"); p.className = "punto"; contPuntos.appendChild(p); });
        const puntos = contPuntos.children;

        function mostrar(i) {
            slides[actual].classList.remove("activa");
            puntos[actual].classList.remove("activo");
            actual = (i + slides.length) % slides.length;
            slides[actual].classList.add("activa");
            puntos[actual].classList.add("activo");
        }
        function programarFotos() {
            clearInterval(timerFotos);
            timerFotos = setInterval(() => mostrar(actual + 1), 4000);
        }
        mostrar(0);
        programarFotos();
        document.getElementById("marco").addEventListener("click", () => { mostrar(actual + 1); programarFotos(); });

        // ---------- MÚSICA ----------
        const audio = document.getElementById("musica");
        const btn = document.getElementById("btnMusica");
        audio.volume = 0.6;

        let ctx = null, timerNotas = null, usandoSintetizada = false;

        // Respaldo: melodía de caja de música ("Brilla, brilla, estrellita") si no se encuentra musica.mp3
        const FREQ = { C: 523.25, D: 587.33, E: 659.25, F: 698.46, G: 783.99, A: 880.0 };
        const MELODIA = "CCGGAAGFFEEDDCGGFFEEDGGFFEEDCCGGAAGFFEEDDC".split("");
        const PAUSAS_LARGAS = [6, 13, 20, 27, 34, 41];

        function tocarNota(freq, t, dur) {
            const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
            o1.type = "sine"; o2.type = "triangle";
            o1.frequency.value = freq; o2.frequency.value = freq * 2;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o1.connect(g); o2.connect(g); g.connect(ctx.destination);
            o1.start(t); o2.start(t); o1.stop(t + dur); o2.stop(t + dur);
        }
        function programarMelodia() {
            const paso = 0.5;
            let t = ctx.currentTime + 0.1;
            MELODIA.forEach((n, i) => {
                const larga = PAUSAS_LARGAS.includes(i);
                tocarNota(FREQ[n], t, larga ? 1.2 : 0.8);
                t += larga ? paso * 2 : paso;
            });
            timerNotas = setTimeout(programarMelodia, (t - ctx.currentTime) * 1000 + 800);
        }
        function iniciarSintetizada() {
            ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === "suspended") ctx.resume();
            usandoSintetizada = true;
            clearTimeout(timerNotas);
            programarMelodia();
            actualizarBoton(true);
        }
        function detenerSintetizada() {
            clearTimeout(timerNotas);
            if (ctx) ctx.suspend();
            usandoSintetizada = false;
            actualizarBoton(false);
        }

        function actualizarBoton(sonando) {
            btn.textContent = sonando ? "🔊" : "🎵";
            btn.classList.toggle("sonando", sonando);
            btn.classList.remove("llamar");
        }
        function estaSonando() { return usandoSintetizada || !audio.paused; }
        function reproducir() {
            return audio.play().then(() => actualizarBoton(true)).catch(() => iniciarSintetizada());
        }
        function pausar() {
            if (usandoSintetizada) detenerSintetizada();
            else { audio.pause(); actualizarBoton(false); }
        }

        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            estaSonando() ? pausar() : reproducir();
        });

        // Los navegadores solo dejan sonar con un toque del usuario: arranca con el primer toque en la pantalla
        function primerToque(e) {
            if (btn.contains(e.target)) return;           // el botón de música se maneja solo
            document.removeEventListener("click", primerToque);
            document.removeEventListener("touchend", primerToque);
            if (!estaSonando()) reproducir();
        }
        document.addEventListener("click", primerToque);
        document.addEventListener("touchend", primerToque);

        // ---------- ANIMACIÓN MÁGICA ----------
        const magia = document.getElementById("magia");
        const EMOJIS = ["🦄", "⭐", "✨", "🌈", "💖", "🌸", "💜", "🩷"];
        function crearFlotante() {
            const el = document.createElement("span");
            el.className = "flota";
            el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = (16 + Math.random() * 26) + "px";
            el.style.setProperty("--desvio", (Math.random() * 120 - 60) + "px");
            el.style.animationDuration = (7 + Math.random() * 7) + "s";
            magia.appendChild(el);
            setTimeout(() => el.remove(), 15000);
        }
        setInterval(crearFlotante, 600);
        for (let i = 0; i < 8; i++) setTimeout(crearFlotante, i * 250);

        // Confeti en colores unicornio
        const COLORES = ["#ff66a3", "#9b5de5", "#5ed6c7", "#f2c94c", "#ffb3d9"];
        function lluvia() {
            confetti({ particleCount: 90, spread: 80, origin: { y: 0.6 }, colors: COLORES, shapes: ["star", "circle"], scalar: 1.2 });
        }
        window.addEventListener("load", () => { lluvia(); setTimeout(lluvia, 900); });

        // Al tocar el unicornio: más magia
        document.getElementById("logo").addEventListener("click", () => {
            lluvia();
            for (let i = 0; i < 6; i++) setTimeout(crearFlotante, i * 80);
        });

        // ---------- CUENTA REGRESIVA ----------
        const dos = n => String(n).padStart(2, "0");
        const intervalo = setInterval(() => {
            const distancia = inicio.getTime() - Date.now();
            if (distancia < 0) {
                clearInterval(intervalo);
                document.getElementById("cuenta").innerHTML = Date.now() < inicio.getTime() + 12 * 3600 * 1000
                    ? '<h3 class="hoy">¡Hoy es el gran día! 🎉🦄</h3>'
                    : "";
                return;
            }
            document.getElementById("dias").textContent = dos(Math.floor(distancia / 86400000));
            document.getElementById("horas").textContent = dos(Math.floor((distancia % 86400000) / 3600000));
            document.getElementById("minutos").textContent = dos(Math.floor((distancia % 3600000) / 60000));
            document.getElementById("segundos").textContent = dos(Math.floor((distancia % 60000) / 1000));
        }, 1000);
    </script>
</body>
</html>
